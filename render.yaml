# Optional Render Blueprint — or mirror these settings in the dashboard.
services:
  - type: web
    name: visualsolver-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
